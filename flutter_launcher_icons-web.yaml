# Regenerate only web icons: dart run flutter_launcher_icons -f flutter_launcher_icons-web.yaml
flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icons/portfolio.png"
  web:
    generate: true
    image_path: "assets/icons/portfolio.png"
    background_color: "#0A0F2E"
    theme_color: "#0A0F2E"
