<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore selected mobile apps and backend projects, technical skills, and experience. Get in touch to discuss your next project.">
  <meta name="author" content="Mr. IT Cheahav">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#0A0F2E">

  <!-- Link previews. The SEO build step replaces image URLs with the dedicated
       /social/portfolio-preview-v2.png artwork at the production origin. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mr. IT Cheahav">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Mobile App Developer Portfolio">
  <meta property="og:description" content="Explore selected mobile apps and backend projects, technical skills, and experience. Get in touch to discuss your next project.">
  <meta property="og:image" content="icons/portfolio.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="Handwritten Portfolio wordmark on a warm ivory background">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mr. IT Cheahav | Mobile App Developer">
  <meta name="twitter:description" content="Explore selected mobile apps and backend projects, technical skills, and experience. Get in touch to discuss your next project.">
  <meta name="twitter:image" content="icons/portfolio.png">
  <meta name="twitter:image:alt" content="Handwritten Portfolio wordmark on a warm ivory background">
  <!-- Production URLs are inserted by tool/prepare_web_seo.dart. -->
  <!-- seo:production:start -->
  <!-- seo:production:end -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cheahav Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=portfolio-1">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=portfolio-1">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=portfolio-1">

  <title>Mr. IT Cheahav | Mobile App Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0A0F2E;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background-color: #0A0F2E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      transition: opacity 400ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading .brand {
      color: #00D4FF;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    #loading h1, #loading p {
      max-width: 560px;
      margin: 0;
      padding: 0 24px;
      color: #F1F5F9;
      text-align: center;
      line-height: 1.5;
    }

    #loading h1 { font-size: 24px; }
    #loading p { font-size: 15px; color: #CBD5E1; }

    @media (prefers-reduced-motion: reduce) {
      #loading { transition: none; }
      #loading .bar { animation: none; }
    }

    #loading .track {
      width: 160px;
      height: 2px;
      border-radius: 2px;
      background-color: #1E2A4A;
      overflow: hidden;
    }

    #loading .bar {
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #0099BB, #00D4FF);
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand">PORTFOLIO</div>
    <h1>Mr. IT Cheahav | Mobile App Developer</h1>
    <p>Explore selected mobile apps and backend projects, technical skills, and experience. Get in touch to discuss your next project.</p>
    <div class="track" role="status" aria-label="Loading portfolio"><div class="bar"></div></div>
    <noscript><p>Enable JavaScript to explore the interactive portfolio and get in touch.</p></noscript>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.classList.add('hidden');
      window.setTimeout(function () { loading.remove(); }, 450);
    });
  </script>
</body>
</html>
