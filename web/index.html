<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mr. IT Cheahav - Mobile app developer crafting elegant, high-performance experiences with Flutter and modern back-end technologies.">
  <meta name="theme-color" content="#0A0F2E">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mr. IT Cheahav - Mobile App Developer">
  <meta property="og:description" content="Portfolio of Mr. IT Cheahav: Flutter mobile applications, back-end services and selected case studies.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mr. IT Cheahav - Mobile App Developer">
  <meta name="twitter:description" content="Portfolio of Mr. IT Cheahav: Flutter mobile applications, back-end services and selected case studies.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mr. IT Cheahav - Mobile App Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0A0F2E;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background-color: #0A0F2E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      transition: opacity 400ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading .brand {
      color: #00D4FF;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    #loading .track {
      width: 160px;
      height: 2px;
      border-radius: 2px;
      background-color: #1E2A4A;
      overflow: hidden;
    }

    #loading .bar {
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #0099BB, #00D4FF);
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand">PORTFOLIO</div>
    <div class="track"><div class="bar"></div></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.classList.add('hidden');
      window.setTimeout(function () { loading.remove(); }, 450);
    });
  </script>
</body>
</html>
